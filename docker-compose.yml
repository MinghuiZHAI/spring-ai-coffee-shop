services:
  mysql:
    image: mysql:8.0
    container_name: atlantic-mysql
    restart: unless-stopped          # Docker Desktop 重启后自动恢复（脚手架补充）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: atlantic_coffee
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "33061:3306"         # 宿主 3306 常被本地 MySQL 服务占用 → 固定避让到 33061（容器内仍 3306）；部署期移除
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8           # Redis 8：原 Redis Stack 模块（RediSearch 等）已并入开源发行版，
    container_name: atlantic-redis   # 同时承担会话缓存（#15）与向量检索（#13）
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "63791:6379"         # 宿主 6379 常被本地 Redis 服务占用 → 固定避让到 63791（容器内仍 6379）；部署期移除
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend     # Maven 工程整体位于 backend/（仓库布局见 04-详细设计 v1.4 §6.4）
      dockerfile: Dockerfile  # eclipse-temurin:21-jre 基础镜像，Spring Boot 分层 jar
    container_name: atlantic-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"               # 不对宿主机暴露，统一走 nginx

  nginx:
    image: nginx:1.26-alpine
    container_name: atlantic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro      # SSE 反代配置见 #32
      - ./nginx/certs:/etc/nginx/certs:ro        # Let's Encrypt 证书（#33）
      - ./frontend/dist:/usr/share/nginx/html:ro # Vue3 构建产物
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data: